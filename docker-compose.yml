services:
  postgres:
    image: postgres:16
    container_name: ticket-management-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ticket_management
      POSTGRES_USER: ticket_user
      POSTGRES_PASSWORD: ticket_password
    ports:
      - '5435:5432'
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ticket_user -d ticket_management']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
