name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  quality:
    name: Format, lint, build, and test
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql://ticket_user:ticket_password@localhost:5432/ticket_management_test
      DATABASE_URL: postgresql://ticket_user:ticket_password@localhost:5432/ticket_management_test
      JWT_SECRET: test-secret
      NODE_ENV: test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ticket_management_test
          POSTGRES_USER: ticket_user
          POSTGRES_PASSWORD: ticket_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ticket_user -d ticket_management_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U ticket_user -d ticket_management_test && break || sleep 1
          done

      - name: Check formatting
        run: npm run format:check

      - name: Lint code
        run: npm run lint

      - name: Build project
        run: npm run build

      - name: Run tests
        env:
          TEST_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: npm test
